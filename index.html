<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G-SPORT</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506}
#app{display:block;width:100%;height:100%;border:0;background:#050506;transform:translate3d(var(--mx,0px),var(--my,0px),0) scale(1.004);transform-origin:center;transition:filter .25s ease;will-change:transform}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#d8aa67;background:#050506;font:12px Arial;letter-spacing:.18em;z-index:200}
#outerSheen{position:fixed;inset:-10%;z-index:60;pointer-events:none;background:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.025) 45%,rgba(218,171,105,.045) 49%,transparent 57%);mix-blend-mode:screen;animation:outerSweep 10s ease-in-out infinite}
@keyframes outerSweep{0%,20%{transform:translateX(-45%);opacity:0}36%{opacity:.8}58%{transform:translateX(45%);opacity:.25}100%{transform:translateX(45%);opacity:0}}
#detailDock{position:fixed;right:18px;bottom:18px;z-index:120;width:min(300px,24vw);padding:12px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:linear-gradient(145deg,rgba(8,11,15,.9),rgba(18,12,18,.82));backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.5);color:#eee;font-family:Arial,sans-serif;transition:.25s ease}
#detailDock.collapsed{width:120px;padding:10px 12px}#detailDock.collapsed .detailBody,#detailDock.collapsed .detailTabs{display:none}
.detailTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.detailTop small{font-size:7px;letter-spacing:.22em;color:#d8aa67;font-weight:700}.detailToggle{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#ddd;border-radius:8px;width:27px;height:27px;cursor:pointer}
.detailBody h3{margin:10px 0 5px;font-size:17px}.detailBody p{margin:0;min-height:42px;color:#a8adb2;font-size:10px;line-height:1.55}.detailTabs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.detailTabs button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#b8bdc2;border-radius:999px;padding:5px 7px;font-size:7px;font-weight:700;cursor:pointer}.detailTabs button.active,.detailTabs button:hover{color:#fff;border-color:rgba(216,170,103,.5);background:rgba(216,170,103,.12)}
#liveBadge{position:fixed;left:18px;top:18px;z-index:120;padding:7px 9px;border-radius:999px;border:1px solid rgba(216,170,103,.22);background:rgba(7,8,10,.48);backdrop-filter:blur(10px);color:#d8aa67;font:700 7px Arial;letter-spacing:.18em;pointer-events:none}#liveDot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#79e28a;margin-right:6px;box-shadow:0 0 10px #79e28a;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
@media(max-width:900px){#detailDock{right:10px;bottom:10px;width:min(300px,82vw)}#liveBadge{left:10px;top:10px}}
</style></head><body><div id="boot">G-SPORT · LOADING</div><iframe id="app" allow="fullscreen"></iframe><div id="outerSheen"></div><div id="liveBadge"><span id="liveDot"></span>LIVE MECHANICAL</div>
<aside id="detailDock"><div class="detailTop"><small>G-SPORT / ДЕТАЛИ</small><button class="detailToggle" id="detailToggle">−</button></div><div class="detailBody"><h3 id="detailTitle">КОРПУС</h3><p id="detailText">Несущая оболочка часов. Защищает механизм и задаёт форму всей конструкции.</p></div><div class="detailTabs" id="detailTabs"></div></aside>
<script src="patches/quality.js"></script><script src="patches/mechanism.js"></script><script src="patches/content.js"></script><script src="patches/layout.js"></script><script src="patches/layout-fix.js"></script><script src="patches/atmosphere.js"></script><script src="patches/panel-toggle.js"></script><script src="patches/living-ui.js"></script>
<script>
const detailData={
'КОРПУС':'Несущая оболочка часов. Защищает механизм и задаёт форму всей конструкции.',
'СТЕКЛО':'Защитный прозрачный слой над циферблатом. Ловит отражения и сохраняет читаемость.',
'ЦИФЕРБЛАТ':'Главная плоскость индикации времени: метки, логотип и визуальная иерархия.',
'СТРЕЛКИ':'Часовая, минутная и секундная индикация времени.',
'БЕЗЕЛЬ':'Кольцо вокруг стекла. Фиксирует фронтальную часть и визуально собирает корпус.',
'ГОЛОВКА':'Элемент ручной настройки и завода механизма.',
'МЕХАНИЗМ':'Шестерни, барабан, спуск и баланс превращают энергию в точный ход.',
'ЗАДНЯЯ КРЫШКА':'Закрывает механизм с обратной стороны и завершает конструкцию.'};
const tabs=document.getElementById('detailTabs'),title=document.getElementById('detailTitle'),text=document.getElementById('detailText');Object.entries(detailData).forEach(([k,v],i)=>{const b=document.createElement('button');b.textContent=k;if(!i)b.className='active';b.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=k;text.textContent=v};tabs.appendChild(b)});document.getElementById('detailToggle').onclick=()=>{const p=document.getElementById('detailDock');p.classList.toggle('collapsed');document.getElementById('detailToggle').textContent=p.classList.contains('collapsed')?'+':'−'};
let tx=0,ty=0,cx=0,cy=0;addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*3;ty=(e.clientY/innerHeight-.5)*2},{passive:true});function breathe(){cx+=(tx-cx)*.045;cy+=(ty-cy)*.045;const f=document.getElementById('app');f.style.setProperty('--mx',cx.toFixed(2)+'px');f.style.setProperty('--my',cy.toFixed(2)+'px');requestAnimationFrame(breathe)}breathe();
(async()=>{try{const names=['v5chunks/chunk-00.txt','v5chunks/chunk-01.txt','v5chunks/chunk-02.txt','v5chunks/chunk-03.txt','v5chunks/chunk-04.txt','v5chunks/chunk-05.txt','v5chunks/chunk-06.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const G=window.GSportPatches||{};html=G.applyQuality?G.applyQuality(html):html;html=G.applyMechanism?G.applyMechanism(html):html;html=G.applyContent?G.applyContent(html):html;const f=document.getElementById('app');f.srcdoc=html;f.addEventListener('load',()=>{try{G.injectLayout?.(f.contentDocument);G.injectLayoutFix?.(f.contentDocument);G.injectAtmosphere?.(f.contentDocument);G.injectPanelToggle?.(f.contentDocument);G.injectLivingUI?.(f.contentDocument)}catch(err){console.error('visual patch',err)}document.getElementById('boot')?.remove()},{once:true})}catch(e){document.getElementById('boot').textContent='LOAD ERROR · '+e.message;console.error(e)}})();
</script></body></html>
