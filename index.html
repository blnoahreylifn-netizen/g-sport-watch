<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>G-SPORT</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506}
#app{display:block;width:100%;height:100%;border:0;background:#050506;transform:translate3d(var(--mx,0px),var(--my,0px),0) scale(1.004);transform-origin:center;transition:filter .25s ease;will-change:transform}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#d8aa67;background:#050506;font:12px Arial;letter-spacing:.18em;z-index:200}
#outerSheen{position:fixed;inset:-10%;z-index:60;pointer-events:none;background:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.025) 45%,rgba(218,171,105,.045) 49%,transparent 57%);mix-blend-mode:screen;animation:outerSweep 10s ease-in-out infinite}
@keyframes outerSweep{0%,20%{transform:translateX(-45%);opacity:0}36%{opacity:.8}58%{transform:translateX(45%);opacity:.25}100%{transform:translateX(45%);opacity:0}}
#detailDock{position:fixed;right:18px;top:auto;bottom:18px;transform:none;z-index:140;width:min(360px,28vw);padding:16px;border:1px solid rgba(216,170,103,.30);border-radius:18px;background:linear-gradient(145deg,rgba(7,10,14,.96),rgba(19,13,18,.92));backdrop-filter:blur(22px);box-shadow:0 28px 90px rgba(0,0,0,.62),0 0 34px rgba(216,170,103,.08);color:#eee;font-family:Arial,sans-serif;transition:.25s ease}
#detailDock:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;border-radius:2px;background:linear-gradient(#d8aa67,rgba(216,170,103,.08));opacity:.8}
#detailDock.collapsed{width:132px;padding:11px 13px;transform:none}#detailDock.collapsed .detailBody,#detailDock.collapsed .detailTabs{display:none}
.detailTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.detailTop small{font-size:8px;letter-spacing:.23em;color:#d8aa67;font-weight:800}.detailToggle{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#eee;border-radius:9px;width:29px;height:29px;cursor:pointer}
.detailBody h3{margin:13px 0 7px;font-size:21px;letter-spacing:-.02em}.detailBody p{margin:0;color:#c1c5c9;font-size:11px;line-height:1.68}.detailBody .detailMeta{margin-top:10px;color:#dcb77d;font-size:8px;letter-spacing:.09em}.detailTabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.detailTabs button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#c2c6cb;border-radius:999px;padding:6px 8px;font-size:7px;font-weight:800;cursor:pointer;transition:.2s ease}.detailTabs button.active,.detailTabs button:hover{color:#fff;border-color:rgba(216,170,103,.65);background:rgba(216,170,103,.16);box-shadow:0 0 18px rgba(216,170,103,.08)}
#liveBadge{position:fixed;left:18px;top:18px;z-index:120;padding:7px 9px;border-radius:999px;border:1px solid rgba(216,170,103,.22);background:rgba(7,8,10,.48);backdrop-filter:blur(10px);color:#d8aa67;font:700 7px Arial;letter-spacing:.18em;pointer-events:none}#liveDot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#79e28a;margin-right:6px;box-shadow:0 0 10px #79e28a;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
@media(max-width:1100px){#detailDock{right:14px;width:min(330px,31vw)}}
@media(max-width:900px){#app{transform:none!important}#detailDock{right:8px;left:8px;top:auto;bottom:max(8px,env(safe-area-inset-bottom));transform:none;width:auto;max-height:38vh;overflow:auto;padding:12px;border-radius:15px}#detailDock.collapsed{left:auto;right:8px;width:126px;transform:none}#liveBadge{left:10px;top:max(10px,env(safe-area-inset-top))}.detailTabs button{font-size:8px;padding:8px 9px}.detailToggle{width:36px;height:36px}#outerSheen{display:none}}
</style></head><body><div id="boot">G-SPORT · LOADING</div><iframe id="app" allow="fullscreen"></iframe><div id="outerSheen"></div><div id="liveBadge"><span id="liveDot"></span>LIVE MECHANICAL</div>
<aside id="detailDock"><div class="detailTop"><small>G-SPORT / ДЕТАЛИ</small><button class="detailToggle" id="detailToggle">−</button></div><div class="detailBody"><h3 id="detailTitle">КОРПУС</h3><p id="detailText">Корпус — силовая оболочка часов. Он удерживает стекло, безель, механизм и заднюю крышку в одной жёсткой конструкции, защищает внутренности от ударов и задаёт общий силуэт модели.</p><div class="detailMeta" id="detailMeta">ФУНКЦИЯ · ЗАЩИТА / ЖЁСТКОСТЬ</div></div><div class="detailTabs" id="detailTabs"></div></aside>
<script src="patches/quality.js"></script><script src="patches/mechanism.js"></script><script src="patches/content.js"></script><script src="patches/live-watch.js?v=a3b6ebc"></script><script src="patches/layout.js"></script><script src="patches/layout-fix.js"></script><script src="patches/atmosphere.js"></script><script src="patches/panel-toggle.js"></script><script src="patches/mobile.js"></script>
<script>
const detailData={'КОРПУС':{t:'Корпус — силовая оболочка часов. Он удерживает стекло, безель, механизм и заднюю крышку в одной жёсткой конструкции, защищает внутренности от ударов и задаёт общий силуэт модели.',m:'ФУНКЦИЯ · ЗАЩИТА / ЖЁСТКОСТЬ'},'СТЕКЛО':{t:'Стекло закрывает циферблат сверху и принимает на себя контакт с внешней средой. Оно должно пропускать свет без искажений, защищать разметку и стрелки и при этом давать красивые отражения по краю.',m:'ФУНКЦИЯ · ЗАЩИТА / ЧИТАЕМОСТЬ'},'ЦИФЕРБЛАТ':{t:'Циферблат — визуальная основа часов. На нём расположены метки, логотип и шкала времени; именно относительно него движутся стрелки, поэтому от его контраста и композиции зависит мгновенное считывание времени.',m:'ФУНКЦИЯ · ИНДИКАЦИЯ ВРЕМЕНИ'},'СТРЕЛКИ':{t:'Стрелки передают текущее время. Часовая делает один оборот за 12 часов, минутная — за 60 минут, секундная — за 60 секунд.',m:'ФУНКЦИЯ · ИНДИКАЦИЯ ВРЕМЕНИ'},'БЕЗЕЛЬ':{t:'Безель обрамляет стекло и визуально связывает его с корпусом. Он защищает край стекла, усиливает фронтальную часть и формирует характерный контур часов при взгляде спереди.',m:'ФУНКЦИЯ · ФИКСАЦИЯ / ЗАЩИТА КРАЯ'},'ГОЛОВКА':{t:'Заводная головка — главный ручной орган управления механическими часами. Через неё переводят время, а в традиционном механизме ещё и передают энергию на завод пружины.',m:'ФУНКЦИЯ · НАСТРОЙКА / ЗАВОД'},'МЕХАНИЗМ':{t:'Механизм — сердце часов. Барабан хранит энергию, зубчатая передача распределяет её, спуск дозирует импульсы, а баланс со спиралью задаёт ритм; поэтому внутри сайта шестерни и баланс действительно двигаются.',m:'ФУНКЦИЯ · ЭНЕРГИЯ / ТОЧНОСТЬ'},'ЗАДНЯЯ КРЫШКА':{t:'Задняя крышка закрывает механизм со стороны запястья. Она завершает корпус, защищает калибр от пыли и контакта и одновременно может служить витриной для механизма, если выполнена прозрачной.',m:'ФУНКЦИЯ · ГЕРМЕТИЗАЦИЯ / ЗАЩИТА'}};
const tabs=document.getElementById('detailTabs'),title=document.getElementById('detailTitle'),text=document.getElementById('detailText'),meta=document.getElementById('detailMeta');Object.entries(detailData).forEach(([k,v],i)=>{const b=document.createElement('button');b.textContent=k;if(!i)b.className='active';b.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=k;text.textContent=v.t;meta.textContent=v.m};tabs.appendChild(b)});document.getElementById('detailToggle').onclick=()=>{const p=document.getElementById('detailDock');p.classList.toggle('collapsed');document.getElementById('detailToggle').textContent=p.classList.contains('collapsed')?'+':'−'};
let tx=0,ty=0,cx=0,cy=0;addEventListener('pointermove',e=>{if(innerWidth<=900)return;tx=(e.clientX/innerWidth-.5)*3;ty=(e.clientY/innerHeight-.5)*2},{passive:true});function breathe(){if(innerWidth>900){cx+=(tx-cx)*.045;cy+=(ty-cy)*.045;const f=document.getElementById('app');f.style.setProperty('--mx',cx.toFixed(2)+'px');f.style.setProperty('--my',cy.toFixed(2)+'px')}requestAnimationFrame(breathe)}breathe();
(async()=>{try{const names=['v5chunks/chunk-00.txt','v5chunks/chunk-01.txt','v5chunks/chunk-02.txt','v5chunks/chunk-03.txt','v5chunks/chunk-04.txt','v5chunks/chunk-05.txt','v5chunks/chunk-06.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const G=window.GSportPatches||{};html=G.applyQuality?G.applyQuality(html):html;html=G.applyMechanism?G.applyMechanism(html):html;html=G.applyContent?G.applyContent(html):html;html=G.applyLiveWatch?G.applyLiveWatch(html):html;const f=document.getElementById('app');f.srcdoc=html;f.addEventListener('load',()=>{try{G.injectLayout?.(f.contentDocument);G.injectLayoutFix?.(f.contentDocument);G.injectAtmosphere?.(f.contentDocument);G.injectPanelToggle?.(f.contentDocument);G.injectMobile?.(f.contentDocument);const st=f.contentDocument.createElement('style');st.id='gs-no-duplicate-details';st.textContent='.lab-panel .part-explain{display:none!important}';f.contentDocument.head.appendChild(st)}catch(err){console.error('visual patch',err)}document.getElementById('boot')?.remove()},{once:true})}catch(e){document.getElementById('boot').textContent='LOAD ERROR · '+e.message;console.error(e)}})();
</script></body></html>
