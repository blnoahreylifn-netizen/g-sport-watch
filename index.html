<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G-SPORT</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506}#app{display:block;width:100%;height:100%;border:0;background:#050506}#boot{position:fixed;inset:0;display:grid;place-items:center;color:#d8aa67;background:#050506;font:12px Arial;letter-spacing:.18em;z-index:2}</style></head><body><div id="boot">G-SPORT · LOADING</div><iframe id="app" allow="fullscreen"></iframe>
<script src="patches/quality.js"></script><script src="patches/mechanism.js"></script><script src="patches/content.js"></script><script src="patches/layout.js"></script><script src="patches/layout-fix.js"></script><script src="patches/atmosphere.js"></script><script src="patches/panel-toggle.js"></script>
<script>(async()=>{try{const names=['v5chunks/chunk-00.txt','v5chunks/chunk-01.txt','v5chunks/chunk-02.txt','v5chunks/chunk-03.txt','v5chunks/chunk-04.txt','v5chunks/chunk-05.txt','v5chunks/chunk-06.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const G=window.GSportPatches||{};html=G.applyQuality?G.applyQuality(html):html;html=G.applyMechanism?G.applyMechanism(html):html;html=G.applyContent?G.applyContent(html):html;const f=document.getElementById('app');f.srcdoc=html;f.addEventListener('load',()=>{try{G.injectLayout?.(f.contentDocument);G.injectLayoutFix?.(f.contentDocument);G.injectAtmosphere?.(f.contentDocument);G.injectPanelToggle?.(f.contentDocument)}catch(err){console.error('visual patch',err)}document.getElementById('boot')?.remove()},{once:true})}catch(e){document.getElementById('boot').textContent='LOAD ERROR · '+e.message;console.error(e)}})();</script></body></html>
